services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    command:
      - "-scheme"
      - "http"
      - "-public-host"
      - "localhost:4443"
      - "-port"
      - "4443"
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/storage

volumes:
  mongo-data:
  gcs-data:
