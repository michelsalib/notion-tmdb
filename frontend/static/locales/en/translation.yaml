# --- setup steps ---
STEP_CONNECTED: Notion connected
STEP_CONNECTED_SUB: You can disconnect at any time from Notion's settings.
STEP_DATABASE: Choose a database
STEP_DATABASE_SUB: Pick the database to fill in, then check the column matches.
STEP_DATABASE_DONE: Column matches are saved. Change them here any time.
STEP_EMBED: Add the widget to Notion
STEP_EMBED_SUB: Paste this link into any Notion page.
STEP_EMBED_LOCKED: Unlocks once you have saved a database.
NO_DATABASES: We cannot see any database in your workspace yet. Share one with the integration, or let us create one for you.

