<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta
      name="description"
      content="Notion connectors that fill in your database for you — films, games, books, plays, and workspace backups."
    />
    <!--
      Inline ⇄ mark, swapped for the connector's own logo once React mounts
      (see App.tsx). A data URI rather than a path because static assets are
      copied in after the bundle is built, so the bundler cannot resolve one —
      and a real mark rather than the blank 1px pixel that used to sit here, so
      the tab never shows an empty icon.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 32 32%22%3E%3Crect width%3D%2232%22 height%3D%2232%22 rx%3D%227%22 fill%3D%22%230B6E99%22%2F%3E%3Cpath d%3D%22M6 11.5h14V8l6 5-6 5v-3.5H6z%22 fill%3D%22%23fff%22%2F%3E%3Cpath d%3D%22M26 20.5H12V17l-6 5 6 5v-3.5h14z%22 fill%3D%22%23fff%22 opacity%3D%22.72%22%2F%3E%3C%2Fsvg%3E"
    />
    <!--
      No webfont. This used to block first paint on a Google Fonts stylesheet
      for Roboto — a render-blocking third-party request on every page load, for
      a face the system stack already substitutes acceptably. MUI's typography
      is pinned to the same stack in src/theme.ts.
    -->
    <style>
      html {
        font-family:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
