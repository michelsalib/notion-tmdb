# --- restore ---
RESTORE_INTRO: A restore rebuilds this backup as one new page at the top level of your workspace, ready to move wherever you want it. Nothing you have now is overwritten, moved or deleted.
RESTORE_CAVEAT: Uploaded files, relations, status columns and comments cannot be recreated. The new page lists everything the restore left behind.
RESTORE_SOURCE: From the backup taken {{when}}.
RESTORE_ACTION: Restore this backup
RESTORING: Restoring…
RESTORE_DONE: Restore finished.
RESTORE_OPEN: Open the restored page
RESTORE_FAILURE: Restore failed.

