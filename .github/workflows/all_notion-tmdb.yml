name: Run checks on every commit of this repo

on:
  push:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        if: always()
        run: bun x biome check .

      - name: Backend typecheck
        if: always()
        run: bun x tsgo -p backend --noEmit

      - name: Frontend typecheck
        if: always()
        run: bun x tsgo -p frontend --noEmit
